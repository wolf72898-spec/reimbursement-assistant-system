<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程变更与签证协同 · 远筑工程</title>
<style>
  :root{
    --navy:#286451; --navy2:#286451; --amber:#3d7a5c; --amber-l:#eaf2ed;
    --bg:#f4f6f2; --card:#fff; --line:#dce5de; --text:#213c39; --muted:#687e75;
    --green:#286451; --green-l:#eaf2ed; --red:#b0524a; --red-l:#f9ece9;
    --purple:#5b6d9e; --purple-l:#edf0f7; --cyan:#3a7d74; --cyan-l:#e8f2ef;
    --pale:#eaf2ed; --paper:#f7f8f4; --ink:#203c3c;
    --shadow:0 1px 2px rgba(32,60,60,.05),0 8px 24px rgba(32,60,60,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- 登录 ---------- */
  .login-mask{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#e7efe7 0%,#d3e3d6 45%,#b9d2c0 100%)}
  .login-card{width:412px;background:#fff;border-radius:14px;padding:34px 34px 28px;box-shadow:0 24px 60px rgba(32,60,52,.22)}
  .login-logo{width:56px;height:56px;border-radius:12px;background:#286451;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;margin:0 auto 14px;
    box-shadow:0 10px 20px rgba(40,100,81,.28)}
  .login-card h1{font-size:21px;text-align:center;margin:0 0 6px;letter-spacing:.5px}
  .login-card p.sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 22px;line-height:1.7}
  .field{margin-bottom:12px}
  .field input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font-size:14px;background:#fbfcfe;outline:none;transition:.18s}
  .field input:focus{border-color:#6a9b88;background:#fff;box-shadow:0 0 0 4px rgba(40,100,81,.09)}
  .btn-primary{width:100%;height:44px;border:0;border-radius:9px;background:#286451;
    color:#fff;font-size:15px;font-weight:600;letter-spacing:1px}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-demo{width:100%;height:40px;margin-top:10px;border:1px dashed #9dbfae;border-radius:9px;
    background:#f2f8f5;color:#286451;font-size:13px;font-weight:600;display:flex;align-items:center;
    justify-content:center;gap:7px;transition:.15s}
  .btn-demo:hover{background:#e6f2ec;border-style:solid}
  .btn-demo:disabled{opacity:.6;pointer-events:none}
  .btn-demo .spin{animation:demo-spin .8s linear infinite}
  @keyframes demo-spin{to{transform:rotate(360deg)}}
  .login-switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
  .login-switch a{color:var(--navy2);font-weight:600;cursor:pointer;text-decoration:none}
  .login-hint{margin-top:14px;padding:10px 12px;border-radius:9px;background:var(--pale);color:#4d6b5f;font-size:12px;line-height:1.7}

  /* ---------- 布局 ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
  .sidebar{background:#fbfcfa;border-right:1px solid var(--line);color:#3d554d;display:flex;flex-direction:column;padding:18px 14px}
  .brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid var(--line)}
  .brand .mark{width:36px;height:36px;border-radius:9px;background:#286451;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .brand b{color:var(--ink);font-size:14.5px;display:block;letter-spacing:.4px}
  .brand small{font-size:10.5px;color:#8ba197;letter-spacing:1.2px}
  .nav{margin-top:14px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav-group{font-size:10.5px;color:#93a89e;padding:12px 10px 6px;letter-spacing:1px}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:0;border-radius:9px;
    background:transparent;color:#4a6157;font-size:13.5px;text-align:left;position:relative;transition:.16s}
  .nav button svg{width:17px;height:17px;opacity:.8;flex:none}
  .nav button:hover{background:#eef3ee;color:var(--ink)}
  .nav button.active{background:var(--pale);color:#1e4638;font-weight:600}
  .nav button.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:#286451}
  .nav .badge{margin-left:auto;background:#286451;color:#fff;font-size:10.5px;border-radius:9px;padding:1px 6px;font-weight:600}
  .userbox{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:9px;background:#286451;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
  .userbox b{display:block;color:var(--ink);font-size:13px;font-weight:600}
  .userbox small{font-size:11px;color:#8ba197}
  .userbox .out{margin-left:auto;background:transparent;border:1px solid var(--line);color:#5c7368;border-radius:8px;padding:5px 9px;font-size:11.5px}

  main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:18px;flex:none}
  .page-title h1{margin:0;font-size:17px;font-weight:700}
  .page-title p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .search{display:flex;align-items:center;gap:8px;background:#f2f6f2;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:36px;width:240px}
  .search input{border:0;background:transparent;outline:none;font-size:13px;width:100%}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:36px;padding:0 14px;font-size:13px;color:#33473f;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#b9cdc2;background:#f7faf7}
  .btn.primary{background:#286451;border:0;color:#fff;font-weight:600}
  .btn.primary:hover{background:#1e5040}
  .btn.ghost{background:transparent}
  .btn.sm{height:29px;padding:0 10px;font-size:12px;border-radius:8px}
  .btn.danger{color:var(--red);border-color:#f3c9c9}
  .btn.ok{color:var(--green);border-color:#bfe3cb}
  .views{flex:1;overflow:auto;padding:22px 26px 40px}

  /* ---------- 通用卡片 ---------- */
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .grid-2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-top:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
  .card-h h3{margin:0;font-size:14px;font-weight:700}
  .card-h .more{margin-left:auto;font-size:12px;color:var(--navy2);cursor:pointer}
  .card-b{padding:16px 18px}
  .kpi{padding:16px 18px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:72px;height:72px;border-radius:50%;background:var(--tint,#eef3fb)}
  .kpi .lab{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .num{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .kpi .num small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
  .kpi .foot{font-size:11.5px;color:var(--muted)}
  .kpi .foot b{color:var(--green)}

  /* ---------- 列表 ---------- */
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .t{flex:1;min-width:0}
  .row .t b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t span{font-size:11.5px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .p-blue{background:#e8f0fc;color:#1d4ed8}.p-amber{background:var(--amber-l);color:#b45309}
  .p-green{background:var(--green-l);color:var(--green)}.p-red{background:var(--red-l);color:var(--red)}
  .p-purple{background:var(--purple-l);color:var(--purple)}.p-cyan{background:var(--cyan-l);color:var(--cyan)}
  .p-gray{background:#f1f3f7;color:#5b6577}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:11px 12px;background:#f5f8f5;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px;border-bottom:1px solid #f0f3f8;font-size:13px;vertical-align:middle}
  tbody tr{cursor:pointer;transition:.14s}
  tbody tr:hover{background:#f5f9f6}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#2c5747;font-weight:600}
  .money{font-variant-numeric:tabular-nums;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;color:#42506b}
  .chip.active{background:#286451;border-color:#286451;color:#fff;font-weight:600}

  /* ---------- 抽屉 ---------- */
  .drawer-mask{position:fixed;inset:0;background:rgba(32,60,52,.32);z-index:40;display:flex;justify-content:flex-end}
  .drawer{width:620px;max-width:94vw;background:#fff;height:100%;overflow:auto;box-shadow:-18px 0 44px rgba(12,28,58,.18);animation:slide .22s ease}
  @keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
  .drawer-h{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
  .drawer-h h2{margin:6px 0 8px;font-size:17px}
  .drawer-h .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .drawer-b{padding:18px 22px 26px}
  .sec{margin-bottom:22px}
  .sec h4{margin:0 0 10px;font-size:13px;color:#33466b;display:flex;align-items:center;gap:8px}
  .sec h4::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--amber)}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:12.5px}
  .info-grid div span{color:var(--muted);margin-right:6px}
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#e2ebe4}
  .tl-item{position:relative;padding:8px 0 8px 6px}
  .tl-item::before{content:"";position:absolute;left:-17px;top:14px;width:9px;height:9px;border-radius:50%;background:#c9d5e8;border:2px solid #fff}
  .tl-item.valid::before{background:var(--green)}
  .tl-item b{font-size:12.5px}
  .tl-item p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
  .mini{font-size:12px;color:var(--muted)}

  /* ---------- 模态 ---------- */
  .modal-mask{position:fixed;inset:0;background:rgba(32,60,52,.34);z-index:50;display:flex;align-items:center;justify-content:center}
  .modal{width:520px;max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(9,22,46,.3)}
  .modal-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal-h h3{margin:0;font-size:15px}
  .modal-h .x{margin-left:auto;border:0;background:transparent;font-size:20px;color:#93a0b5;line-height:1}
  .modal-b{padding:18px 20px}
  .modal-f{padding:14px 20px 18px;display:flex;gap:10px;justify-content:flex-end}
  .form-row{margin-bottom:12px}
  .form-row label{display:block;font-size:12.5px;color:#3d554d;margin-bottom:6px}
  .form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;outline:none;font-family:inherit;background:#fafcf9}
  .form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:#6a9b88;background:#fff}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

  /* ---------- 图表 ---------- */
  .bars{display:flex;align-items:flex-end;gap:12px;height:132px;padding-top:8px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#3d7a5c,#286451);min-height:3px}
  .bar-wrap span{font-size:11px;color:var(--muted)}
  .hbar{margin-bottom:12px}
  .hbar .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .hbar .track{height:9px;border-radius:5px;background:#eef2f8;overflow:hidden}
  .hbar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#286451,#5d9983)}

  /* ---------- 助手 ---------- */
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 66px - 62px);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .chat-head .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #e7f8ee}
  .chat-head b{font-size:13.5px}
  .chat-head span{font-size:11.5px;color:var(--muted)}
  .msgs{flex:1;overflow:auto;padding:18px 22px;background:linear-gradient(180deg,#f8fbf8,#fff)}
  .msg{display:flex;gap:10px;margin-bottom:16px}
  .msg .who{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:#8ba197}
  .msg.user .who{background:#286451}
  .msg.ai .who{background:#5d9983}
  .bubble{max-width:74%;background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:11px 14px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .msg.user{flex-direction:row-reverse}
  .msg.user .bubble{background:#286451;color:#fff;border:0;border-radius:12px 4px 12px 12px}
  .bubble .src{margin-top:8px;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
  .tool-line{font-size:11.5px;color:#7c8aa3;margin:2px 0 6px 42px;font-family:ui-monospace,Consolas,monospace}
  .chat-input{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;background:#fff}
  .chat-input textarea{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13.5px;resize:none;height:44px;max-height:120px;font-family:inherit;outline:none;background:#fbfcfe}
  .chat-input textarea:focus{border-color:#6a9b88;background:#fff}
  .sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 12px}
  .sugg button{border:1px solid #cfdcd2;background:#f2f7f2;color:#2c5747;border-radius:18px;padding:6px 12px;font-size:12px}
  .sugg button:hover{background:#e3efe5}

  /* ---------- 管理 ---------- */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabs button{border:0;background:transparent;padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tabs button.active{color:#286451;font-weight:700;border-bottom-color:#286451}
  .help{font-size:12px;color:var(--muted);line-height:1.8}

  /* ---------- FDE 风格工作台 ---------- */
  .fde-crumb{display:flex;align-items:flex-start;gap:18px;margin-bottom:14px}
  .fde-crumb .where{font-size:12.5px;color:var(--ink);font-weight:600}
  .fde-crumb .desc{font-size:12.5px;color:var(--muted);margin-top:6px}
  .fde-crumb .right{margin-left:auto}
  .fde-proposers{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:grid;gap:6px;max-width:560px}
  .fde-proposers .p-row{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
  .fde-proposers .p-row b{color:var(--ink);font-weight:600;min-width:92px}
  .fde-hero{background:var(--pale);border:1px solid #d8e6db;border-radius:10px;padding:30px 32px;display:flex;align-items:center;gap:20px;margin-bottom:14px}
  .fde-hero .eyebrow{font-size:11.5px;color:#5f7d6d;letter-spacing:.5px;margin-bottom:10px}
  .fde-hero h1{margin:0;font-size:clamp(26px,2.6vw,38px);line-height:1.35;letter-spacing:-1px;color:#203b36;font-weight:700}
  .fde-hero h1 em{font-style:normal;color:#537a50}
  .fde-hero .sub{margin:10px 0 0;font-size:13px;color:#73857c;line-height:1.8}
  .fde-hero .right{margin-left:auto;flex:none}
  .fde-stats{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 26px;margin-bottom:14px}
  .fde-stats .nums{display:flex;gap:70px;flex-wrap:wrap}
  .fde-stats .stat .n{font-size:34px;font-weight:800;color:#203b36;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .fde-stats .stat .n small{font-size:16px;color:#748581;font-weight:600;margin-left:2px}
  .fde-stats .stat .t{font-size:12px;color:#839186;margin-top:4px}
  .fde-stats .focus{border-top:1px dashed var(--line);margin-top:18px;padding-top:14px;font-size:12.5px;color:var(--muted);line-height:1.8}
  .fde-stats .focus b{color:var(--ink)}
  .fde-quick{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px;margin-bottom:14px}
  .fde-quick button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:15px 18px;font-size:13.5px;font-weight:600;color:#33473f;text-align:left;display:flex;align-items:center;justify-content:space-between}
  .fde-quick button:hover{border-color:#b9cdc2;background:#f7faf7}
  .fde-quick button.dark{background:#286451;border-color:#286451;color:#fff}
  .fde-quick button.dark:hover{background:#1e5040}
  .fde-stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:20px}
  .fde-stages .st{border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px 12px 10px;text-align:left;transition:.15s;position:relative}
  .fde-stages .st:hover{border-color:#9dbca9;transform:translateY(-1px)}
  .fde-stages .st .no{font-size:10.5px;color:#93a89e;font-weight:700}
  .fde-stages .st .tt{font-size:12.5px;font-weight:700;color:var(--ink);margin:5px 0 6px;white-space:nowrap}
  .fde-stages .st .tk{font-size:10.5px;color:#8ba197}
  .fde-stages .st.active{background:#286451;border-color:#286451}
  .fde-stages .st.active .no,.fde-stages .st.active .tt,.fde-stages .st.active .tk{color:#dcebe2}
  .fde-stages .st.active .tt{color:#fff}
  .fde-quick button span{flex:none;margin-left:10px}
  main{min-width:0}
  .views>*{min-width:0}
  .grid-4>*,.grid-2>*,.fde-crumb,.fde-hero,.fde-stats,.fde-quick,.fde-stages{min-width:0}

  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#203c3c;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.24s;z-index:99;max-width:70vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ 登录 ============ -->
<div class="login-mask" id="loginMask">
  <div class="login-card">
    <div class="login-logo">远</div>
    <h1>工程变更与签证协同</h1>
    <p class="sub">版本唯一 · 交底必达 · 签证同源 · 留痕可审计<br>远筑工程 · 数字化协同平台</p>
    <div class="field"><input id="li-user" placeholder="用户名" autocomplete="username"></div>
    <div class="field"><input id="li-pass" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password"></div>

<script>
/* ============================================================
   基础工具
============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => "¥" + Number(n || 0).toLocaleString("zh-CN", {maximumFractionDigits: 0});
const dt = s => s ? String(s).replace("T", " ").slice(0, 16) : "—";
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 2600);
}

let TOKEN = localStorage.getItem("ra_token") || "";
let ROLE = localStorage.getItem("ra_role") || "";
let USER = localStorage.getItem("ra_username") || "";
let VIEW = "home";
let CACHE = {changes: [], briefings: [], visas: [], dash: null, projects: []};
let FILTER = {status: "全部", q: ""};
let SESSION = null;
let AUTH_MODE = "login";

async function api(path, opts = {}) {
  const headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if (res.status === 401) { logout(); throw new Error("登录已失效，请重新登录"); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = {detail: text}; }
  if (!res.ok) throw new Error((data && (data.detail || data.message)) || ("请求失败 " + res.status));
  return data;
}

/* ============================================================
   状态徽标
============================================================ */
const STATUS_STYLE = {
  "待交底": "p-gray", "交底中": "p-blue", "待签证": "p-amber", "待核定": "p-purple",
  "待业主确认": "p-cyan", "已确认": "p-green", "已驳回": "p-red", "已归档": "p-gray", "已作废": "p-gray",
  "待签收": "p-amber", "已签收": "p-green", "已超时": "p-red", "已失效": "p-gray", "草稿": "p-gray"
};
const pill = s => `<span class="pill ${STATUS_STYLE[s] || "p-gray"}">${esc(s)}</span>`;

/* ============================================================
   登录 / 注册
============================================================ */
function setMode(mode) {
  AUTH_MODE = mode;
  const reg = mode === "register";
  $("#deptField").style.display = reg ? "block" : "none";
  $("#btnAuth").textContent = reg ? "注 册" : "登 录";
  $("#switchTip").textContent = reg ? "已有账号？" : "没有账号？";
  $("#btnSwitch").textContent = reg ? "去登录" : "立即注册";
  $("#loginHint").textContent = reg
    ? "提示：首个注册用户自动成为管理员；也可点「一键体验」直接用演示账号进入。"
    : "演示账号：zhangsan / abc123456（管理员）";
}
$("#btnSwitch").onclick = () => setMode(AUTH_MODE === "login" ? "register" : "login");

async function loginAs(username, password) {
  const d = await api("/api/auth/login", {method: "POST", body: JSON.stringify({username, password})});
  TOKEN = d.access_token; ROLE = d.role; USER = username;
  const me = await api("/api/auth/me");
  localStorage.setItem("ra_token", TOKEN);
  localStorage.setItem("ra_role", ROLE);
  localStorage.setItem("ra_username", USER);
  localStorage.setItem("ra_uid", me.id);
  enterApp();
}

$("#btnAuth").onclick = async () => {
  const username = $("#li-user").value.trim();
  const password = $("#li-pass").value;
  if (!username || password.length < 6) return toast("请填写用户名，密码至少 6 位");
  try {
    if (AUTH_MODE === "register") {
      await api("/api/auth/register", {method: "POST", body: JSON.stringify({username, password, department: $("#li-dept").value.trim()})});
    }
    await loginAs(username, password);
  } catch (e) { toast(e.message); }
};

$("#btnDemo").onclick = async () => {
  const btn = $("#btnDemo");
  btn.disabled = true;
  btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> 正在进入演示…`;
  try {
    await loginAs("zhangsan", "abc123456");
    toast("已使用演示账号（管理员）登录");
  } catch (e) {
    toast("演示登录失败：" + e.message + "，请手动输入 zhangsan / abc123456");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg> 一键体验（演示账号登录）`;
  }
};

function logout() {
  TOKEN = ""; ROLE = ""; USER = "";
  localStorage.clear();
  $("#loginMask").classList.remove("hidden");
  $("#app").classList.add("hidden");
  SESSION = null;
}
$("#btnLogout").onclick = logout;

async function enterApp() {
  $("#loginMask").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#uName").textContent = USER;
  $("#uRole").textContent = ROLE === "admin" ? "管理员" : "员工";
  $("#uAvatar").textContent = (USER || "员")[0].toUpperCase();
  $("#navAdmin").style.display = ROLE === "admin" ? "flex" : "none";
  await refreshAll();
  switchView("home");
}

/* ============================================================
   数据加载
============================================================ */
async function refreshAll() {
  const [projects, changes, briefings, visas, dash] = await Promise.all([
    api("/api/projects").catch(() => []),
    api("/api/changes").catch(() => []),
    api("/api/briefings").catch(() => []),
    api("/api/visas").catch(() => []),
    api("/api/dashboard").catch(() => null)
  ]);
  CACHE = {projects, changes, briefings, visas, dash};
  const b = $("#badgeBrief"), c = $("#badgeChanges"), v = $("#badgeVisa");
  const pendingBrief = briefings.filter(x => x.status === "待签收").length;
  const pendingVisa = visas.filter(x => x.status === "待核定" || x.status === "待业主确认").length;
  const active = changes.filter(x => !["已归档", "已作废"].includes(x.status)).length;
  b.textContent = pendingBrief; b.classList.toggle("hidden", !pendingBrief);
  c.textContent = active; c.classList.toggle("hidden", !active);
  v.textContent = pendingVisa; v.classList.toggle("hidden", !pendingVisa);
  if (dash && dash.project) $("#pageSub").textContent = dash.project.name + (dash.project.code ? " · " + dash.project.code : "");
}

/* ============================================================
   视图切换
============================================================ */
const TITLES = {
  home: ["工作台", "今日待办与流程健康度"],
  changes: ["变更台账", "版本唯一，来源可追溯"],
  briefings: ["交底中心", "按角色定向推送，签收留痕"],
  visas: ["签证协同", "与变更同源，多方在线确认"],
  dashboard: ["数据看板", "五项基线指标实时可测"],
  assistant: ["AI 协同助手", "检索制度、分析问题、起草签证"],
  admin: ["管理后台", "知识库 · 提示词 · 对话审计"]
};
function switchView(name) {
  VIEW = name;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  $("#view-" + name).classList.remove("hidden");
  $("#pageTitle").textContent = TITLES[name][0];
  $("#pageSub").textContent = TITLES[name][1];
  ({home: renderHome, changes: renderChanges, briefings: renderBriefings, visas: renderVisas,
    dashboard: renderDashboard, assistant: renderAssistant, admin: renderAdmin}[name] || (() => {}))();
}
document.querySelectorAll(".nav button").forEach(btn => btn.onclick = () => switchView(btn.dataset.view));

/* ============================================================
   工作台（FDE 训练中心风格）
============================================================ */
const FDE_STAGES = [
  {no:"01", title:"业务挖掘", map:"assistant", tk:"AI 协同助手"},
  {no:"02", title:"现场调研", map:"briefings", tk:"交底中心"},
  {no:"03", title:"需求定义", map:"changes",   tk:"变更台账"},
  {no:"04", title:"方案设计", map:"dashboard", tk:"指标与口径"},
  {no:"05", title:"构建集成", map:"changes",   tk:"版本管理"},
  {no:"06", title:"测试评估", map:"dashboard", tk:"数据看板"},
  {no:"07", title:"客户试点", map:"visas",     tk:"签证协同"},
  {no:"08", title:"上线交接", map:"assistant", tk:"AI 留痕"},
  {no:"09", title:"运营迭代", map:"admin",     tk:"提示词与审计"}
];
function renderHome() {
  const d = CACHE.dash || {metrics: {}};
  const m = d.metrics || {};
  const briefPending = CACHE.briefings.filter(x => x.status === "待签收");
  const visaPending = CACHE.visas.filter(x => ["待核定", "待业主确认"].includes(x.status));
  const recent = CACHE.changes.slice(0, 6);
  const signedN = CACHE.briefings.filter(x => x.status === "已签收").length;
  const confirmedN = CACHE.visas.filter(x => x.status === "已确认").length;
  const p = (CACHE.projects && CACHE.projects[0]) || {name: "远筑工程", code: ""};

  $("#view-home").innerHTML = `
    <div class="fde-crumb">
      <div>
        <div class="where">${esc(p.name)}${p.code ? " · " + esc(p.code) : ""}</div>
        <div class="desc">围绕“工程变更与签证协同”开展业务挖掘、现场调研、需求定义与后续交付。</div>
        <div class="fde-proposers">
          <div class="p-row"><b>主问题提出人</b><span>林亦舟 · 现场施工员</span></div>
          <div class="p-row"><b>共同提出人</b><span>顾明岚 · 项目经理</span></div>
        </div>
      </div>
      <button class="btn right" data-go="dashboard">数据看板 →</button>
    </div>

    <div class="fde-hero">
      <div>
        <div class="eyebrow">FDE 全流程 / 工程变更与签证协同</div>
        <h1>工程变更与签证协同 · <em>协同工作台</em></h1>
        <p class="sub">每一步留存行动、结论、证据和责任人：变更登记 → 定向交底 → 签收留痕 → 签证同源 → 人工核定。</p>
      </div>
      <button class="btn primary right" id="btnExport">导出全流程记录 ↓</button>
    </div>

    <div class="fde-stats">
      <div class="nums">
        <div class="stat"><div class="n">${signedN} <small>/ ${CACHE.briefings.length}</small></div><div class="t">交底签收 · 全员签收方可进入签证</div></div>
        <div class="stat"><div class="n">${confirmedN} <small>/ ${CACHE.visas.length}</small></div><div class="t">签证确认 · 造价核价 + 业主确认</div></div>
        <div class="stat"><div class="n">${briefPending.length + visaPending.length}</div><div class="t">我的待办 · 待签收 + 待处理</div></div>
      </div>
      <div class="focus"><b>当前关注：</b>业务挖掘 · 处理时长、返工次数、版本正确率、采用率与人工复核成本，需用本项目样本建立基线</div>
    </div>

    <div class="fde-quick">
      <button data-go="assistant">流程与制度问答 <span>→</span></button>
      <button data-go="dashboard">ROI 与基线测算 <span>→</span></button>
      <button class="dark" data-go="changes">项目 Demo 与交付 →</button>
    </div>

    <div class="fde-stages">
      ${FDE_STAGES.map((s, i) => `
        <button class="st ${i === 0 ? "active" : ""}" data-stage="${s.map}" data-si="${i}">
          <div class="no">${s.no}</div><div class="tt">${s.title}</div><div class="tk">${s.tk}</div>
        </button>`).join("")}
    </div>

    <div class="grid-4">
      ${kpi("在办变更", m.total_changes ?? 0, "条", "#eaf2ed", "共 " + CACHE.changes.length + " 条已登记")}
      ${kpi("待签收交底", m.pending_briefings ?? 0, "条", "#f2f7f2", "签收率 " + pct(m.briefing_rate))}
      ${kpi("待处理签证", visaPending.length, "笔", "#edf0f7", "签证合计 " + money(m.visa_total))}
      ${kpi("平均处理时长", m.avg_cycle_days ?? 0, "天", "#e8f2ef", "目标下降 50%")}
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-h"><h3>我的待办</h3><span class="more" data-go="briefings">全部交底 →</span></div>
        <div class="card-b">
          ${briefPending.length ? briefPending.slice(0, 4).map(b => `
            <div class="row">
              <div class="t"><b>${esc(b.change_code)} · ${esc(b.role)}</b>
                <span>${esc(b.change_title)} · V${b.version_no} · 截止 ${dt(b.due_at)}</span></div>
              ${pill("待签收")}
              <button class="btn sm ok" data-sign="${b.id}">签收</button>
            </div>`).join("") : `<div class="empty">交底任务已全部签收</div>`}
          ${visaPending.length ? `<div class="card-h" style="padding:16px 0 10px;border:0"><h3 style="font-size:13px">签证待办</h3></div>` : ""}
          ${visaPending.slice(0, 4).map(v => `
            <div class="row">
              <div class="t"><b>${esc(v.code)} · ${esc(v.change_title)}</b>
                <span>${money(v.amount)} · 来源 V${v.source_version} · ${esc(v.status)}</span></div>
              ${v.status === "待核定"
                ? `<button class="btn sm" data-review="${v.id}" data-act="核价">核价</button>`
                : `<button class="btn sm ok" data-review="${v.id}" data-act="确认">确认</button>`}
            </div>`).join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>流程健康度</h3><span class="more" data-go="dashboard">看板 →</span></div>
        <div class="card-b">${statusBars()}</div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h"><h3>最近变更</h3><span class="more" data-go="changes">进入台账 →</span></div>
      <div class="card-b" style="padding-top:6px">
        ${recent.length ? recent.map(c => `
          <div class="row" data-open="${c.id}" style="cursor:pointer">
            <div class="t"><b>${esc(c.title)}</b><span>${esc(c.code)} · ${esc(c.category)} · ${esc(c.location)} · ${esc(c.owner_role || "未指派")}</span></div>
            <span class="money mini">${money(c.amount_impact)}</span>
            ${pill(c.status)}
          </div>`).join("") : `<div class="empty">暂无变更，点击右上角「新建变更」开始</div>`}
      </div>
    </div>`;

  $("#view-home").querySelectorAll("[data-stage]").forEach(b => b.onclick = () => {

    b.classList.add("active");
    switchView(b.dataset.stage);
  });
  $("#btnExport").onclick = exportRecord;
  bindCommon($("#view-home"));
}
function exportRecord() {
  const payload = {
    exported_at: new Date().toLocaleString("zh-CN"),
    project: (CACHE.projects && CACHE.projects[0]) || null,
    metrics: (CACHE.dash && CACHE.dash.metrics) || {},
    changes: CACHE.changes, briefings: CACHE.briefings, visas: CACHE.visas
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "工程变更与签证协同-全流程记录.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("全流程记录已导出（JSON）");
}
function kpi(lab, num, unit, tint, foot) {
  return `<div class="kpi" style="--tint:${tint}">
    <div class="lab">${lab}</div>
    <div class="num">${num}<small>${unit}</small></div>
    <div class="foot">${foot || ""}</div></div>`;
}
function pct(v) { return Math.round(Number(v || 0) * 100) + "%"; }

function statusBars() {
  const by = (CACHE.dash && CACHE.dash.by_status) || {};
  const order = ["交底中", "待签证", "待核定", "待业主确认", "已确认", "已驳回", "已归档"];
  const max = Math.max(1, ...order.map(k => by[k] || 0));
  return order.filter(k => (by[k] || 0) > 0).map(k => `
    <div class="hbar">
      <div class="top"><span>${k}</span><b>${by[k] || 0}</b></div>
      <div class="track"><div class="fill" style="width:${Math.round((by[k] || 0) / max * 100)}%"></div></div>
    </div>`).join("") || `<div class="empty">暂无数据</div>`;
}

/* ============================================================
   变更台账
============================================================ */
function renderChanges() {
  const tabs = ["全部", "交底中", "待签证", "待核定", "待业主确认", "已确认", "已驳回"];
  const rows = CACHE.changes.filter(c =>
    (FILTER.status === "全部" || c.status === FILTER.status) &&
    (!FILTER.q || (c.title + c.code + c.location).includes(FILTER.q)));

  $("#view-changes").innerHTML = `
    <div class="chips">${tabs.map(t => `<button class="chip ${FILTER.status === t ? "active" : ""}" data-filter="${t}">${t}</button>`).join("")}</div>
    <div class="card">
      <table>
        <thead><tr>
          <th style="width:132px">编号</th><th>变更事项</th><th style="width:92px">分类</th>
          <th style="width:110px">部位</th><th style="width:64px">版本</th><th style="width:104px">金额影响</th>
          <th style="width:88px">状态</th><th style="width:86px">责任人</th><th style="width:112px">更新时间</th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(c => `
            <tr data-open="${c.id}">
              <td><span class="code">${esc(c.code)}</span></td>
              <td><b style="font-weight:600">${esc(c.title)}</b>
                ${c.priority === "高" ? `<span class="pill p-red" style="margin-left:6px">高优先</span>` : ""}</td>
              <td>${esc(c.category)}</td>
              <td>${esc(c.location || "—")}</td>
              <td>V${c.current_version}</td>
              <td class="money">${money(c.amount_impact)}</td>
              <td>${pill(c.status)}</td>
              <td>${esc(c.owner_role || "—")}</td>
              <td class="mini">${dt(c.updated_at)}</td>
            </tr>`).join("") : `<tr><td colspan="9"><div class="empty">没有符合条件的变更</div></td></tr>`}
        </tbody>
      </table>
    </div>`;

  $("#view-changes").querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { FILTER.status = b.dataset.filter; renderChanges(); });
  bindCommon($("#view-changes"));
}

/* ============================================================
   交底中心
============================================================ */
let BRIEF_TAB = "待签收";
function renderBriefings() {
  const tabs = ["待签收", "已签收", "全部"];
  const rows = CACHE.briefings.filter(b => BRIEF_TAB === "全部" || b.status === BRIEF_TAB);
  $("#view-briefings").innerHTML = `
    <div class="chips">${tabs.map(t => `<button class="chip ${BRIEF_TAB === t ? "active" : ""}" data-btab="${t}">${t}${t !== "全部" ? `（${CACHE.briefings.filter(x => x.status === t).length}）` : ""}</button>`).join("")}</div>
    <div class="grid-4" style="grid-template-columns:repeat(2,1fr)">
      ${rows.length ? rows.map(b => `
        <div class="card" style="padding:16px 18px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span class="code">${esc(b.change_code)}</span>${pill(b.status)}
            <span class="mini" style="margin-left:auto">V${b.version_no}</span>
          </div>
          <div style="font-size:14px;font-weight:600;margin-bottom:4px">${esc(b.change_title)}</div>
          <div class="mini" style="margin-bottom:10px">交底对象：${esc(b.role)} · ${esc(b.assignee || "待指派")} · 截止 ${dt(b.due_at)}</div>
          ${b.note ? `<div class="mini" style="background:#f5f9f6;border-radius:8px;padding:8px 10px;margin-bottom:10px">${esc(b.note)}</div>` : ""}
          <div style="display:flex;gap:8px">
            ${b.status === "待签收" ? `<button class="btn sm ok" data-sign="${b.id}">确认签收</button>` : `<span class="mini">签收时间 ${dt(b.signed_at)}</span>`}
            <button class="btn sm ghost" data-open="${b.change_id}">查看变更</button>
          </div>
        </div>`).join("") : `<div class="card" style="grid-column:span 2"><div class="empty">该分类下暂无交底任务</div></div>`}
    </div>`;
  $("#view-briefings").querySelectorAll("[data-btab]").forEach(b => b.onclick = () => { BRIEF_TAB = b.dataset.btab; renderBriefings(); });
  bindCommon($("#view-briefings"));
}

/* ============================================================
   签证协同
============================================================ */
function renderVisas() {
  const rows = CACHE.visas;
  const sum = rows.reduce((s, v) => s + (v.amount || 0), 0);
  $("#view-visas").innerHTML = `
    <div class="grid-4">
      ${kpi("签证单总数", rows.length, "笔", "#eaf2ed", "AI 起草 " + rows.filter(v => v.drafted_by_ai).length + " 笔")}
      ${kpi("待核定", rows.filter(v => v.status === "待核定").length, "笔", "#edf0f7", "来源版本与变更同源")}
      ${kpi("待业主确认", rows.filter(v => v.status === "待业主确认").length, "笔", "#e8f2ef", "确认后进入已确认")}
      ${kpi("签证合计", money(sum), "", "#eaf2ed", "已确认 " + rows.filter(v => v.status === "已确认").length + " 笔")}
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-h"><h3>签证单列表</h3><span class="more" id="btnNewVisa">＋ 起草签证</span></div>
      <table>
        <thead><tr><th style="width:126px">编号</th><th>签证事项</th><th style="width:104px">金额</th>
          <th style="width:70px">来源版本</th><th style="width:92px">状态</th><th style="width:90px">经办</th><th style="width:170px">操作</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(v => `
            <tr data-open="${v.change_id}">
              <td><span class="code">${esc(v.code)}</span>${v.drafted_by_ai ? `<span class="pill p-blue" style="margin-left:4px">AI</span>` : ""}</td>
              <td><b style="font-weight:600">${esc(v.title)}</b>
                <div class="mini">${esc(v.change_code)} · ${esc(v.location || "")}</div></td>
              <td class="money">${money(v.amount)}</td>
              <td>V${v.source_version}</td>
              <td>${pill(v.status)}</td>
              <td class="mini">${esc(v.reviewer || v.created_by || "—")}</td>
              <td onclick="event.stopPropagation()">
                ${v.status === "待核定" ? `<button class="btn sm" data-review="${v.id}" data-act="核价">造价核价</button>` : ""}
                ${v.status === "待业主确认" ? `<button class="btn sm ok" data-review="${v.id}" data-act="确认">业主确认</button>` : ""}
                ${["待核定", "待业主确认"].includes(v.status) ? `<button class="btn sm danger" data-review="${v.id}" data-act="驳回">驳回</button>` : ""}
                ${["已确认", "已驳回"].includes(v.status) ? `<span class="mini">已结束</span>` : ""}
              </td>
            </tr>`).join("") : `<tr><td colspan="7"><div class="empty">暂无签证单</div></td></tr>`}
        </tbody>
      </table>
    </div>`;
  const nv = $("#btnNewVisa"); if (nv) nv.onclick = () => openVisaModal(null);
  bindCommon($("#view-visas"));
}

/* ============================================================
   数据看板
============================================================ */
function renderDashboard() {
  const d = CACHE.dash || {metrics: {}, trend: [], by_category: {}};
  const m = d.metrics || {};
  const trend = d.trend || [];
  const maxT = Math.max(1, ...trend.map(t => t.count));
  const cats = d.by_category || {};
  const catMax = Math.max(1, ...Object.values(cats), 1);

  $("#view-dashboard").innerHTML = `
    <div class="grid-4">
      ${kpi("变更处理时长", m.avg_cycle_days ?? 0, "天", "#eaf2ed", "目标 ↓50%")}
      ${kpi("交底签收率", pct(m.briefing_rate), "", "#e2efe6", "目标 100%")}
      ${kpi("版本正确率", pct(m.version_accuracy), "", "#e8f2ef", "目标 ≥98%")}
      ${kpi("版本错位返工", m.rework_count ?? 0, "次", "#f9ece9", "近 6 个月 · 目标 ↓80%")}
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-h"><h3>近 7 天新增变更</h3><span class="more">登记时间口径</span></div>
        <div class="card-b">
          <div class="bars">
            ${trend.map(t => `<div class="bar-wrap">
              <div class="bar" style="height:${Math.max(4, Math.round(t.count / maxT * 100))}%;${t.count ? "" : "background:#e8edf6"}" title="${t.date}：${t.count} 条"></div>
              <span>${t.date}</span></div>`).join("")}
          </div>
          <div class="help" style="margin-top:8px">演示数据分散在近 7 天，便于观察趋势；接入业务系统后按实际登记时间统计。</div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>按分类分布</h3><span class="more">变更结构</span></div>
        <div class="card-b">
          ${Object.keys(cats).length ? Object.entries(cats).map(([k, n]) => `
            <div class="hbar"><div class="top"><span>${esc(k)}</span><b>${n}</b></div>
            <div class="track"><div class="fill" style="width:${Math.round(n / catMax * 100)}%"></div></div></div>`).join("") : `<div class="empty">暂无数据</div>`}
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h"><h3>五项基线指标口径</h3><span class="more">对齐业务挖掘报告</span></div>
      <div class="card-b help">
        <b>① 变更处理时长</b>：变更发布 → 现场确认交底的间隔（天）；<b>② 返工次数</b>：版本错位导致的返工工单数；
        <b>③ 版本正确率</b>：现场使用正确版本次数 / 抽查次数；<b>④ 签证采用率</b>：业主确认签证数 / 提交签证数（当前 ${pct(m.visa_adoption)}）；
        <b>⑤ 人工复核成本</b>：复核工时 × 人数 / 签证单数（当前基线 ${money(m.review_cost)}）。
        未接入业务系统的指标标注为「基线待采集」，与业务挖掘报告口径一致。
      </div>
    </div>`;
  bindCommon($("#view-dashboard"));
}

  $("#drawerHost").innerHTML = `
    <div class="drawer-mask" id="dMask">
      <div class="drawer">
        <div class="drawer-h">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="code">${esc(c.code)}</span>${pill(c.status)}
            ${c.priority === "高" ? `<span class="pill p-red">高优先</span>` : ""}
            <button class="btn sm ghost" style="margin-left:auto" id="dClose">关闭</button>
          </div>
          <h2>${esc(c.title)}</h2>
          <div class="meta">
            <span>${esc(c.project_name)}</span><span>${esc(c.category)}</span>
            <span>部位 ${esc(c.location || "—")}</span><span>当前 V${c.current_version}</span>
          </div>
        </div>
        <div class="drawer-b">
          <div class="sec">
            <h4>基本信息</h4>

              <div><span>发起人</span>${esc(c.initiator || "—")}</div>
              <div><span>责任人</span>${esc(c.owner_role || "—")}</div>
              <div><span>金额影响</span>${money(c.amount_impact)}</div>
              <div><span>工期影响</span>${c.schedule_impact} 天</div>
              <div><span>登记时间</span>${dt(c.created_at)}</div>
              <div><span>最近更新</span>${dt(c.updated_at)}</div>
            </div>
            <div class="mini" style="margin-top:10px;background:#f5f9f6;padding:10px 12px;border-radius:9px;line-height:1.7">${esc(c.reason || "无变更说明")}</div>
          </div>

          <div class="sec">
            <h4>版本记录（唯一有效版本：V${valid ? valid.version_no : c.current_version}）</h4>
            <div class="tl">
              ${(c.versions || []).map(v => `
                <div class="tl-item ${v.is_valid ? "valid" : ""}">
                  <b>V${v.version_no} ${v.is_valid ? `<span class="pill p-green" style="margin-left:6px">现行</span>` : `<span class="pill p-gray" style="margin-left:6px">已作废</span>`}</b>
                  <p>${esc(v.summary)}<br>${esc(v.file_name)} · ${esc(v.uploaded_by)} · ${dt(v.created_at)}</p>
                </div>`).join("") || `<div class="mini">暂无版本</div>`}
            </div>
          </div>

          <div class="sec">
            <h4>交底签收</h4>
            ${(c.briefings || []).length ? (c.briefings || []).map(b => `
              <div class="row">
                <div class="t"><b>${esc(b.role)} · ${esc(b.assignee)}</b>
                  <span>V${b.version_no} · 截止 ${dt(b.due_at)}${b.signed_at ? " · 签收于 " + dt(b.signed_at) : ""}</span></div>
                ${pill(b.status)}
                ${b.status === "待签收" ? `<button class="btn sm ok" data-sign="${b.id}">签收</button>` : ""}
              </div>`).join("") : `<div class="mini">暂无交底任务</div>`}
          </div>

          <div class="sec">
            <h4>签证单</h4>
            ${(c.visas || []).length ? (c.visas || []).map(v => `
              <div class="row">
                <div class="t"><b>${esc(v.code)} · ${money(v.amount)}</b>
                  <span>来源 V${v.source_version} · ${esc(v.created_by)}${v.drafted_by_ai ? " · AI 起草" : ""}</span></div>
                ${pill(v.status)}
                ${v.status === "待核定" ? `<button class="btn sm" data-review="${v.id}" data-act="核价">核价</button>` : ""}
                ${v.status === "待业主确认" ? `<button class="btn sm ok" data-review="${v.id}" data-act="确认">确认</button>` : ""}
              </div>`).join("") : `<div class="mini">尚无签证单（完成交底后可起草）</div>`}

          <div style="display:flex;gap:10px;border-top:1px solid var(--line);padding-top:16px">
            <button class="btn" data-version="${c.id}">上传新版本</button>
            <button class="btn primary" data-visa="${c.id}">起草签证</button>

  bindCommon($("#drawerHost"));
}
function closeDrawer() { $("#drawerHost").innerHTML = ""; }

/* ============================================================
   动作
============================================================ */
async function signBriefing(id) {
  try {
    await api("/api/briefings/" + id + "/sign", {method: "POST", body: JSON.stringify({note: "已阅读并理解本版变更内容"})});
    toast("签收成功，已留痕");
    await refreshAll();
    closeDrawer();
    switchView(VIEW);
  } catch (e) { toast(e.message); }
}
async function reviewVisa(id, act) {
  let note = "";
  if (act === "驳回") {
    note = prompt("请填写驳回原因（将记入签证单）") || "";
    if (!note) return;
  }
  try {
    await api("/api/visas/" + id + "/review", {method: "POST", body: JSON.stringify({action: act, note})});
    toast(act === "核价" ? "造价核价完成，转业主确认" : act === "确认" ? "业主已确认，签证生效" : "已驳回");
    await refreshAll();
    closeDrawer();
    switchView(VIEW);
  } catch (e) { toast(e.message); }
}
async function archiveChange(id) {
  try {
    await api("/api/changes/" + id + "/archive", {method: "POST", body: "{}"});
    toast("已归档");
    await refreshAll(); closeDrawer(); switchView(VIEW);
  } catch (e) { toast(e.message); }
}

/* ============================================================
   弹窗
============================================================ */
function openModal(html) {
  $("#modalHost").innerHTML = `<div class="modal-mask" id="mMask"><div class="modal">${html}</div></div>`;
  $("#mMask").onclick = e => { if (e.target.id === "mMask") closeModal(); };
  $("#modalHost").querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
}
function closeModal() { $("#modalHost").innerHTML = ""; }

function openNewChange() {
  const p = CACHE.projects[0];
  openModal(`
    <div class="modal-h"><h3>登记工程变更</h3><button class="x" data-close>×</button></div>
    <div class="modal-b">
      <div class="form-row"><label>项目</label>
        <select id="nc-project">${CACHE.projects.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>
      <div class="form-row"><label>变更事项 *</label><input id="nc-title" placeholder="如：三层梁柱节点钢筋代换"></div>
      <div class="form-grid">
        <div class="form-row"><label>分类</label>
          <select id="nc-cat"><option>设计变更</option><option>现场签证</option><option>材料代用</option><option>工期调整</option></select></div>
        <div class="form-row"><label>部位</label><input id="nc-loc" placeholder="如：3F 梁柱节点"></div>
        <div class="form-row"><label>金额影响（元）</label><input id="nc-amount" type="number" value="0"></div>
        <div class="form-row"><label>工期影响（天）</label><input id="nc-days" type="number" value="0"></div>
        <div class="form-row"><label>优先级</label>
          <select id="nc-pri"><option>中</option><option>高</option><option>低</option></select></div>
        <div class="form-row"><label>责任人</label><input id="nc-owner" placeholder="如：唐映秋" value="${esc(p ? p.manager : "")}"></div>
      </div>
      <div class="form-row"><label>变更说明</label><textarea id="nc-reason" rows="3" placeholder="说明变更原因、依据与影响"></textarea></div>
      <div class="mini">提交后自动生成首版版本（V1），并按角色创建交底任务。</div>
    </div>
    <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="nc-save">确认登记</button></div>`);
  $("#nc-save").onclick = async () => {
    const title = $("#nc-title").value.trim();
    if (title.length < 2) return toast("请填写变更事项");
    try {
      await api("/api/changes", {method: "POST", body: JSON.stringify({
        project_id: Number($("#nc-project").value), title,
        category: $("#nc-cat").value, location: $("#nc-loc").value.trim(),
        amount_impact: Number($("#nc-amount").value || 0),
        schedule_impact: Number($("#nc-days").value || 0),
        priority: $("#nc-pri").value, owner_role: $("#nc-owner").value.trim(),
        reason: $("#nc-reason").value.trim()
      })});
      closeModal(); toast("变更已登记，交底任务已生成");
      await refreshAll(); switchView("changes");
    } catch (e) { toast(e.message); }
  };
}

function openVersionModal(changeId) {
  openModal(`
    <div class="modal-h"><h3>上传新版本</h3><button class="x" data-close>×</button></div>
    <div class="modal-b">
      <div class="form-row"><label>本版变更摘要 *</label><textarea id="nv-sum" rows="3" placeholder="如：修正节点大样并补充工程量计算式"></textarea></div>
      <div class="form-row"><label>文件名</label><input id="nv-file" placeholder="留空自动生成"></div>
      <div class="mini">上传后旧版本自动作废（版本唯一），并按 V+1 重新生成交底任务。</div>
    </div>
    <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="nv-save">上传版本</button></div>`);
  $("#nv-save").onclick = async () => {
    const summary = $("#nv-sum").value.trim();
    if (summary.length < 2) return toast("请填写版本摘要");
    try {
      const r = await api(`/api/changes/${changeId}/versions`, {method: "POST", body: JSON.stringify({summary, file_name: $("#nv-file").value.trim()})});
      closeModal(); closeDrawer(); toast(`已发布 V${r.version_no}，旧版已作废`);
      await refreshAll(); switchView(VIEW);
    } catch (e) { toast(e.message); }
  };
}

function openVisaModal(changeId) {
  const candidates = CACHE.changes.filter(c => ["待签证", "待核定", "待业主确认", "已驳回"].includes(c.status));
  openModal(`
    <div class="modal-h"><h3>起草签证单</h3><button class="x" data-close>×</button></div>
    <div class="modal-b">
      <div class="form-row"><label>关联变更 *</label>
        <select id="nv-change">${candidates.map(c => `<option value="${c.id}" ${c.id === changeId ? "selected" : ""}>${esc(c.code)} · ${esc(c.title)}</option>`).join("") || `<option value="">暂无已完成交底的变更</option>`}</select></div>
      <div class="form-row"><label>签证金额（元）</label><input id="nv-amount" type="number" value="0"></div>
      <div class="form-row"><label>工程量与计算式</label><textarea id="nv-desc" rows="3" placeholder="如：钢筋 12.6t × 5,180 元/t = 65,268 元"></textarea></div>
      <div class="mini">签证单来源版本自动取变更当前有效版本（同源），提交后进入「待核定」，需造价核价与业主确认。</div>
    </div>
    <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="nv-create">提交起草</button></div>`);
  $("#nv-create").onclick = async () => {
    const cid = Number($("#nv-change").value);
    if (!cid) return toast("请选择关联变更（需先完成交底）");
    try {
      await api("/api/visas", {method: "POST", body: JSON.stringify({
        change_id: cid, amount: Number($("#nv-amount").value || 0),
        quantity_desc: $("#nv-desc").value.trim()
      })});
      closeModal(); closeDrawer(); toast("签证单已起草，待造价核定");

    } catch (e) { toast(e.message); }
  };
}

/* ============================================================
   AI 协同助手（SSE）
============================================================ */
let chatBooted = false;
function renderAssistant() {
  if (chatBooted) return;
  chatBooted = true;
  $("#view-assistant").innerHTML = `
    <div class="chat-wrap">
      <div class="chat-head">
        <div class="dot"></div>
        <div><b>AI 协同助手</b><span> · 检索制度 · 分析变更 · 起草签证</span></div>
        <button class="btn sm ghost" style="margin-left:auto" id="btnNewSession">新会话</button>
      </div>
      <div class="msgs" id="msgs">
        <div class="msg ai"><div class="who">AI</div><div class="bubble">您好，我是工程变更与签证协同助手，可以帮您：<br>· 查询变更台账与签证状态（如「CH-2026-0002 现在什么状态」）<br>· 检索管理制度、分析现场问题<br>· 起草签证单草稿（须先完成交底，金额需人工核定）<br>· 解答现场费用与报销规范（差旅、招待、加班餐）</div></div>
      </div>
      <div class="sugg" id="sugg">
        <button data-q="CH-2026-0002 现在什么状态？">查询变更状态</button>
        <button data-q="哪些交底还没签收？">待签收交底</button>
        <button data-q="变更交底时限要求是什么？">检索管理制度</button>
        <button data-q="帮我为 CH-2026-0004 起草签证单，金额 15800 元">起草签证草稿</button>
        <button data-q="出差住宿标准是多少？">费用规范</button>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
        <button class="btn primary" id="btnSend">发送</button>
      </div>
    </div>`;
  const input = $("#chatInput");
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  $("#btnSend").onclick = sendChat;
  $("#btnNewSession").onclick = () => { SESSION = null; $("#msgs").innerHTML = ""; toast("已开启新会话"); };
  $("#sugg").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { input.value = b.dataset.q; sendChat(); });
}

async function ensureSession() {
  if (SESSION) return SESSION;
  const s = await api("/api/chat/sessions", {method: "POST", body: JSON.stringify({title: "工程协同会话"})});
  SESSION = s.id;
  return SESSION;
}

function addMsg(who, text) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.innerHTML = `<div class="who">${who === "user" ? "我" : "AI"}</div><div class="bubble"></div>`;
  el.querySelector(".bubble").textContent = text;
  $("#msgs").appendChild(el);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  return el.querySelector(".bubble");
}
function addToolLine(text) {
  const el = document.createElement("div");
  el.className = "tool-line";
  el.textContent = text;
  $("#msgs").appendChild(el);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

async function sendChat() {
  const input = $("#chatInput");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  addMsg("user", q);
  let bubble = null, buffer = "", sources = [];
  try {
    const sid = await ensureSession();
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json", Authorization: "Bearer " + TOKEN},
      body: JSON.stringify({session_id: sid, question: q})
    });
    if (!res.ok || !res.body) {
      const t = await res.text();
      throw new Error("对话服务不可用（" + res.status + "）" + (t ? "：" + t.slice(0, 80) : ""));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const parts = buf.split("\n\n");
      buf = parts.pop() || "";
      for (const part of parts) {
        const lines = part.split("\n");
        const evLine = lines.find(l => l.startsWith("event:"));
        const dataLine = lines.find(l => l.startsWith("data:"));
        if (!evLine || !dataLine) continue;
        const ev = evLine.slice(6).trim();
        let data = {};
        try { data = JSON.parse(dataLine.slice(5).trim()); } catch (err) { }
        if (ev === "delta") {
          buffer += data.content || "";
          if (!bubble) bubble = addMsg("ai", "");
          bubble.textContent = buffer;
          $("#msgs").scrollTop = $("#msgs").scrollHeight;
        } else if (ev === "sources") {
          sources = data.items || data.sources || [];
        } else if (ev === "tool_call") {
          addToolLine("调用工具 " + (data.name || "") + " …");
        } else if (ev === "tool_result") {
          addToolLine("✓ " + (data.summary || data.name || "工具返回"));
        } else if (ev === "confirm_request") {
          appendConfirm(data);
        } else if (ev === "error") {
          if (!bubble) bubble = addMsg("ai", "");
          bubble.textContent += "\n[出错] " + (data.message || "服务异常");
        }
      }
    }
    if (!bubble) addMsg("ai", "（本次没有返回内容，请重试）");
    else if (sources && sources.length) {
      const s = document.createElement("div");
      s.className = "src";
      s.textContent = "来源：" + sources.map(x => x.doc_title || x.title || x.source || "知识库").join(" · ");
      bubble.appendChild(s);
    }
  } catch (e) {
    if (!bubble) addMsg("ai", "对话失败：" + e.message);
    else bubble.textContent += "\n[失败] " + e.message;
    toast(e.message);
  }
}

function appendConfirm(data) {
  const el = document.createElement("div");
  el.className = "msg ai";
  const payload = data.payload || data.draft || data;
  el.innerHTML = `<div class="who">AI</div><div class="bubble"><b>待确认操作</b>
    <div style="margin:8px 0;font-size:12.5px;color:#42506b;white-space:pre-wrap">${esc(JSON.stringify(payload, null, 1)).slice(0, 500)}</div>
    <div style="display:flex;gap:8px"><button class="btn sm ok">确认执行</button><button class="btn sm danger">取消</button></div></div>`;
  const [ok, no] = el.querySelectorAll("button");
  ok.onclick = () => { el.querySelector(".bubble").innerHTML = "已确认执行。"; toast("已确认"); };
  no.onclick = () => { el.querySelector(".bubble").innerHTML = "已取消该操作。"; toast("已取消"); };
  $("#msgs").appendChild(el);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

let ADMIN_TAB = "kb";
async function renderAdmin() {
  if (ROLE !== "admin") { $("#view-admin").innerHTML = `<div class="empty">仅管理员可访问</div>`; return; }
  const tabs = `<div class="tabs">
      <button data-atab="kb" class="${ADMIN_TAB === "kb" ? "active" : ""}">知识库</button>
      <button data-atab="prompt" class="${ADMIN_TAB === "prompt" ? "active" : ""}">提示词模板</button>
      <button data-atab="audit" class="${ADMIN_TAB === "audit" ? "active" : ""}">对话审计</button>
    </div>`;
  $("#view-admin").innerHTML = tabs + `<div id="adminBody"><div class="empty">加载中…</div></div>`;
  $("#view-admin").querySelectorAll("[data-atab]").forEach(b => b.onclick = () => { ADMIN_TAB = b.dataset.atab; renderAdmin(); });

  const body = $("#adminBody");
  try {
    if (ADMIN_TAB === "kb") {
      const docs = await api("/api/knowledge/documents");
      body.innerHTML = `
        <div class="card"><div class="card-h"><h3>制度文档</h3>
          <label class="more" style="cursor:pointer">＋ 上传文档（.md/.txt/.pdf）
            <input type="file" id="kbFile" accept=".md,.txt,.pdf" style="display:none"></label></div>
          <table><thead><tr><th>文档</th><th style="width:90px">版本</th><th style="width:80px">切片</th><th style="width:150px">上传时间</th><th style="width:80px">操作</th></tr></thead>
          <tbody>${docs.length ? docs.map(d => `<tr>
            <td><b style="font-weight:600">${esc(d.title)}</b></td><td>v${esc(d.version)}</td>
            <td>${d.chunks}</td><td class="mini">${dt(d.created_at)}</td>
            <td><button class="btn sm danger" data-del="${d.id}">删除</button></td></tr>`).join("")
            : `<tr><td colspan="5"><div class="empty">暂无文档，上传后 AI 才能依据制度回答</div></td></tr>`}</tbody></table>
        </div>
        <div class="help" style="margin-top:10px">上传后自动切片并向量化；未配置 Embedding 时自动降级为 BM25 关键词检索。</div>`;
      $("#kbFile").onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        const fd = new FormData(); fd.append("file", f);
        try {
          const res = await fetch("/api/knowledge/documents", {method: "POST", headers: {Authorization: "Bearer " + TOKEN}, body: fd});
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "上传失败");
          toast(`已入库：${data.title}（${data.chunks} 个切片）`); renderAdmin();
        } catch (err) { toast(err.message); }
      };
      body.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
        if (!confirm("确认删除该文档及其全部切片？")) return;
        try { await api("/api/knowledge/documents/" + b.dataset.del, {method: "DELETE"}); toast("已删除"); renderAdmin(); }
        catch (e) { toast(e.message); }
      });
    } else if (ADMIN_TAB === "prompt") {
      const list = await api("/api/admin/prompts");
      body.innerHTML = `
        <div class="card"><div class="card-h"><h3>提示词模板（保存后立即生效）</h3></div>
          <div class="card-b">
            <div class="form-row"><label>模板</label><select id="ptSel">${list.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("")}</select></div>
            <div class="form-row"><label>内容</label><textarea id="ptContent" rows="14" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px"></textarea></div>
            <div style="display:flex;gap:10px">
              <button class="btn primary" id="ptSave">保存并生效</button>
              <button class="btn" id="ptReset">恢复默认</button>
            </div>
          </div></div>`;
      const sel = $("#ptSel"), ta = $("#ptContent");
      const fill = () => { const p = list.find(x => x.name === sel.value); ta.value = p ? p.content : ""; };
      sel.onchange = fill; fill();
      $("#ptSave").onclick = async () => {
        try { await api("/api/admin/prompts/" + sel.value, {method: "PUT", body: JSON.stringify({content: ta.value})}); toast("已保存，下一轮对话生效"); }
        catch (e) { toast(e.message); }
      };
      $("#ptReset").onclick = async () => {
        try { await api("/api/admin/prompts/" + sel.value + "/reset", {method: "POST", body: "{}"}); toast("已恢复默认"); renderAdmin(); }
        catch (e) { toast(e.message); }
      };
    } else {
      const traces = await api("/api/admin/traces");
      body.innerHTML = `<div class="card"><div class="card-h"><h3>决策日志（Agent 轨迹）</h3></div>
        <table><thead><tr><th style="width:56px">轮次</th><th style="width:170px">工具</th><th>参数摘要</th><th style="width:90px">耗时</th><th style="width:80px">状态</th><th style="width:150px">时间</th></tr></thead>
        <tbody>${(traces || []).length ? traces.map(t => `<tr>
          <td>${t.round ?? "—"}</td><td><span class="code">${esc(t.tool_name || "")}</span></td>
          <td class="mini">${esc(String(t.arguments || t.args || "").slice(0, 120))}</td>
          <td>${t.elapsed_ms ?? "—"} ms</td><td>${pill(t.status || "")}</td>
          <td class="mini">${dt(t.created_at)}</td></tr>`).join("")
          : `<tr><td colspan="6"><div class="empty">暂无对话轨迹，去 AI 助手聊两句即可产生</div></td></tr>`}</tbody></table></div>`;
    }
  } catch (e) {
    body.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
