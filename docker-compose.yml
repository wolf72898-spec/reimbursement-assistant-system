# 生产部署：docker compose up -d
# 开发期可直接 uvicorn app.main:app --reload（SQLite 免装库）
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reimburse
      POSTGRES_PASSWORD: reimburse2026
      POSTGRES_DB: reimbursement
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimburse"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://reimburse:reimburse2026@db:5432/reimbursement
      RAG_API_KEY: ${RAG_API_KEY}
      RAG_BASE_URL: ${RAG_BASE_URL:-https://api.deepseek.com/v1}
      RAG_MODEL: ${RAG_MODEL:-deepseek-chat}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-v3}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
